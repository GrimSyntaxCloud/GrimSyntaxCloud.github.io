version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
    # @astrojs/check supports TypeScript 5/6; revisit before a TypeScript 7 upgrade.
    ignore:
      - dependency-name: typescript
        versions: ['>=7.0.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
